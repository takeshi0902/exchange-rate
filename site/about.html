  <h1 style="font-size:24px;font-weight:700;margin-bottom:24px">關於換匯比較網</h1>
  <div class="card"><div class="card-body" style="font-size:15px;line-height:2">
    <p>換匯比較網是一個專注於台灣換匯資訊的工具網站，整合兆豐銀行、玉山銀行、國泰世華、合作金庫、第一銀行、台新銀行、台北富邦、永豐銀行、華南銀行、彰化銀行、土地銀行等 11 家銀行的即時匯率。</p>
    <p style="margin-top:16px">我們提供三角換匯試算、信用卡海外費用比較、歷史走勢分析等工具，幫助旅遊者和商務人士找到最划算的換匯方式。</p>
    <p style="margin-top:16px"><strong>為什麼建立這個網站？</strong><br>
    每次出國換匯前都要手動查各銀行網站，非常麻煩。換匯比較網的目標是一站整合所有資訊，讓換匯決策更簡單。</p>
    <p style="margin-top:16px"><strong>資料更新頻率：</strong>匯率資料每小時自動更新一次，超過 4 小時未更新時會顯示警示。</p>
  </div></div>
