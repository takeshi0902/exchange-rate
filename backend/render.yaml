services:
  - type: web
    name: exchange-rate-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DISCORD_WEBHOOK_URL
        sync: false          # 在 Render Dashboard 手動填入
      - key: DATABASE_PATH
        value: /var/data/rates.db
      - key: SCRAPE_INTERVAL_HOURS
        value: "1"
      - key: CORS_ORIGINS
        value: "*"
    disk:
      name: exchange-rate-db
      mountPath: /var/data
      sizeGB: 1
